name: Sync assets

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy assets from packages
        run: node scripts/copy-assets.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets static
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No asset changes to commit"
          else
            git commit -m "chore: sync assets from package updates"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify comprofix.com
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/comprofix/comprofix.com/dispatches \
            -d '{"event_type":"module-updated","client_payload":{"repo":"comprofix-chirpy-static-assets"}}'
